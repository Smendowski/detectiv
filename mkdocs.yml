site_name: Detectiv
site_description: Time-series anomaly detection using image representations
repo_url: https://github.com/Smendowski/detectiv
repo_name: Smendowski/detectiv

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Design: design.md
  - First Experiment: first-experiment.md
  - Experiment Surfaces: experiment-surfaces.md
  - Time Series: time-series.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - TSB-AD: benchmarks/tsb-ad.md
  - API:
      - Overview: api/index.md
      - Benchmarks:
          - Overview: api/benchmarks/index.md
          - TSB-AD: api/benchmarks/tsb-ad.md
      - Time Series:
          - Series: api/time-series/series.md
          - Dataset: api/time-series/dataset.md
          - Split: api/time-series/split.md
          - Splitters: api/time-series/splitters.md
          - Preprocessing:
              - Preprocessor Contract: api/time-series/preprocessing/base.md
              - Feature Selection: api/time-series/preprocessing/feature-selection.md
              - Pipeline: api/time-series/preprocessing/pipeline.md
              - Scaling: api/time-series/preprocessing/scaling.md
          - Windowing:
              - Core: api/time-series/windowing/core.md
              - Length Strategies: api/time-series/windowing/lengths.md
              - Window Reference: api/time-series/windowing/reference.md
              - Split Windowing: api/time-series/windowing/split.md
      - Callbacks: api/callbacks.md
      - Runs: api/runs.md
  - Development: development.md
