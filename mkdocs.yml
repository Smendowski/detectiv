site_name: Detectiv
site_description: Time-series anomaly detection using image representations
repo_url: https://github.com/Smendowski/detectiv
repo_name: Smendowski/detectiv

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Design: design.md
  - Callback Lifecycle: callback-lifecycle.md
  - Images: images.md
  - Time Series: time-series.md
  - Time Series To Images: ts2i.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - TSB-AD: benchmarks/tsb-ad.md
  - API:
      - Overview: api/index.md
      - Benchmarks:
          - Overview: api/benchmarks/index.md
          - TSB-AD: api/benchmarks/tsb-ad.md
      - Time Series:
          - Series: api/time-series/series.md
          - Split: api/time-series/split.md
          - Temporal Rules: api/time-series/splitters.md
          - Preprocessing:
              - Preprocessor Contract: api/time-series/preprocessing/base.md
              - Feature Selection: api/time-series/preprocessing/feature-selection.md
              - Pipeline: api/time-series/preprocessing/pipeline.md
              - Scaling: api/time-series/preprocessing/scaling.md
          - Windowing:
              - Core: api/time-series/windowing/core.md
              - Length Strategies: api/time-series/windowing/lengths.md
              - Window Reference: api/time-series/windowing/reference.md
              - Split Windowing: api/time-series/windowing/split.md
      - Time Series To Images:
          - Overview: api/ts2i/index.md
          - Materialization: api/ts2i/materialization.md
          - Channelization: api/ts2i/channelization.md
          - Projection: api/ts2i/projection.md
          - Transformations: api/ts2i/transformations.md
      - Callbacks:
          - Base: api/callbacks/base.md
          - Artifacts: api/callbacks/artifacts.md
          - Timing: api/callbacks/timing.md
          - MLflow: api/callbacks/mlflow.md
          - Reconstruction MLflow: api/callbacks/tracking/reconstruction.md
      - Losses:
          - Reconstruction: api/losses/reconstruction.md
      - Models:
          - Overview: api/models/index.md
          - Autoencoders:
              - Overview: api/models/autoencoders/index.md
              - Training: api/models/autoencoders/training.md
              - Transfer Learning: api/models/autoencoders/transfer-learning.md
              - Encoders:
                  - CNN: api/models/autoencoders/encoders/cnn.md
                  - ResNet: api/models/autoencoders/encoders/resnet.md
                  - PVT: api/models/autoencoders/encoders/pvt.md
              - Decoders:
                  - CNN: api/models/autoencoders/decoders/cnn.md
              - Bottlenecks:
                  - Dense Spatial: api/models/autoencoders/bottlenecks/dense.md
          - Runtime: api/models/runtime.md
      - Images:
          - Dataset: api/images/dataset.md
          - Torch Adapter: api/images/torch.md
          - Artifacts: api/images/io.md
      - Protocols:
          - Overview: api/protocols/index.md
          - Training: api/protocols/training.md
          - Validation: api/protocols/validation.md
      - Scoring:
          - Overview: api/scoring/index.md
          - Reconstruction: api/scoring/reconstruction.md
          - Window Evidence: api/scoring/window-scores.md
          - Point Propagation: api/scoring/propagation.md
          - Plans: api/scoring/plans.md
      - Scenarios:
