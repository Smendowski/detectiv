site_name: Detectiv
site_description: Time-series anomaly detection using image representations
repo_url: https://github.com/Smendowski/detectiv
repo_name: Smendowski/detectiv

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

nav:
  - Overview: index.md
  - Installation: installation.md
  - Design: design.md
  - First Experiment: first-experiment.md
  - Experiment Surfaces: experiment-surfaces.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - TSB-AD: benchmarks/tsb-ad.md
  - API:
      - Overview: api/index.md
      - Benchmarks:
          - Overview: api/benchmarks/index.md
          - TSB-AD: api/benchmarks/tsb-ad.md
      - Callbacks: api/callbacks.md
      - Runs: api/runs.md
  - Development: development.md
