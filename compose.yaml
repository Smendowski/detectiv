services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    entrypoint: ["mlflow"]
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - file:///mlflow/artifacts
      - --serve-artifacts
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  mlflow-data:
